name: employee-api-db-gin
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: employee_api
      POSTGRES_USER: employee_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the environment}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - employee_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee_app -d employee_api"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
volumes:
  employee_postgres_data:
